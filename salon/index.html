<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FiestaControl · V112</title><link rel="stylesheet" href="style.css?v=110"/></head>
<body><div id="app"></div><dialog id="modal"><div id="modal-body"></div></dialog><div id="toast" class="toast"></div>
<script src="/api/bootstrap.js?v=110"></script><script src="app.js?v=110"></script><script src="enhancements.js?v=110"></script>
<script>

(function(){
'use strict';

/* ==========================================================
   FIESTACONTROL V110 - NÚCLEO INTEGRAL
   - Un solo render final de Finanzas
   - Movimientos manuales asociados opcionalmente a una fiesta
   - Revisión de cobros/señas/saldos antes de mostrar contabilidad
   - Tablero por medio de pago
   - Publicidad destacada visible en la portada pública
   - Apariencia pública más festiva + música opcional
   ========================================================== */

const fc110Q=(s,r=document)=>r.querySelector(s);
const fc110QA=(s,r=document)=>Array.from(r.querySelectorAll(s));
const fc110N=v=>Number(v||0);
const fc110Sid=()=>session?.salonId;
const fc110Esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fc110Money=v=>{
  try{return money(fc110N(v))}
  catch(_){return '$ '+fc110N(v).toLocaleString('es-AR')}
};
const fc110Norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function fc110Toast(msg){
  try{toast(msg)}catch(_){alert(msg)}
}
function fc110Modal(html){
  const d=fc110Q('#modal'), b=fc110Q('#modal-body');
  if(!d||!b){alert('No se encontró la ventana del sistema.');return false}
  b.innerHTML=html;
  try{ if(!d.open)d.showModal(); }catch(_){d.setAttribute('open','open')}
  return true;
}
function fc110Close(){
  const d=fc110Q('#modal');
  if(!d)return;
  try{d.close()}catch(_){d.removeAttribute('open')}
}
async function fc110GetState(){
  const r=await fetch('/api/data',{cache:'no-store'});
  if(!r.ok)throw new Error('No se pudo leer la base de datos');
  const j=await r.json();
  return j?.data||j;
}
function fc110UseState(st){
  if(!st||typeof st!=='object')return;
  Object.keys(data).forEach(k=>delete data[k]);
  Object.assign(data,st);
}
async function fc110PutState(st){
  const r=await fetch('/api/data',{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(st),
    cache:'no-store'
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false)throw new Error(j.error||'No se pudo guardar en el servidor');
  return j;
}
async function fc110Post(url,body){
  const r=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),
    cache:'no-store'
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));
  if(j.state)fc110UseState(j.state);
  return j;
}

/* ==========================
   CONTABILIDAD Y RESERVAS
   ========================== */

function fc110SalonEvents(){
  return (data.events||[]).filter(e=>String(e.salonId)===String(fc110Sid()) && e.status!=='Cancelada');
}
function fc110SalonMovements(){
  return (data.movements||[]).filter(m=>String(m.salonId)===String(fc110Sid()));
}
function fc110IsIncome(m){
  const t=fc110Norm(m?.type), c=fc110Norm(m?.category);
  return t==='ingreso'||t==='cobro'||c.includes('cobro')||c.includes('sena');
}
function fc110IsExpense(m){
  const t=fc110Norm(m?.type);
  return t==='gasto'||t==='egreso';
}
function fc110IsDeposit(m){
  const c=fc110Norm(m?.category), x=fc110Norm(m?.concept), k=String(m?.sourceKey||'').toLowerCase();
  return c.includes('sena')||x.includes('sena')||k.includes('deposit');
}
function fc110EventPayments(e){
  const all=fc110SalonMovements().filter(m=>String(m.eventId||'')===String(e.id) && fc110IsIncome(m));
  const seen=new Set();
  return all.filter(m=>{
    const key=String(m.sourceKey||m.id||[
      fc110N(m.amount),fc110Norm(m.method),m.movementDate||'',fc110Norm(m.concept)
    ].join('|'));
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
}
function fc110EventFigures(e){
  const base=fc110N(e.basePrice);
  const extras=fc110N(e.extrasTotal);
  const stock=fc110N(e.stockItemsTotal);
  const staffClient=fc110N(e.staffClientChargeTotal);
  const computed=base+extras+stock+staffClient;
  const total=computed>0?computed:fc110N(e.total);

  const pays=fc110EventPayments(e);
  let paid=pays.reduce((s,m)=>s+fc110N(m.amount),0);

  // Si no hay movimientos históricos pero sí paid/seña, no se pierde el dato.
  if(paid<=0)paid=fc110N(e.paid||e.deposit);
  paid=Math.min(Math.max(0,paid),Math.max(total,paid));
  const balance=Math.max(0,total-paid);

  return {base,extras,stock,staffClient,total,paid,balance,pays};
}

/* Revisión conservadora: no borra movimientos del usuario.
   Corrige total/paid/balance y genera una seña SOLO si falta por completo. */
function fc110AuditAccounting(saveChanges=false){
  data.movements=Array.isArray(data.movements)?data.movements:[];
  let changes=0, warnings=[];

  for(const e of fc110SalonEvents()){
    // Reutilizar la normalización V47 cuando existe porque ya conoce datos históricos.
    try{
      if(typeof window.normalizeAllPayments47==='function'){
        // Se ejecuta una vez por auditoría, no en loop visual.
      }
    }catch(_){}

    const existingDeposit=data.movements.some(m=>
      String(m.salonId)===String(fc110Sid()) &&
      String(m.eventId||'')===String(e.id) &&
      fc110IsDeposit(m)
    );
    const dep=fc110N(e.deposit);
    if(dep>0 && !existingDeposit){
      data.movements.push({
        id:'dep110_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        salonId:fc110Sid(),
        eventId:e.id,
        sourceKey:'v110:deposit:'+e.id,
        type:'Ingreso',
        category:'Seña',
        concept:'Seña de reserva '+(e.eventName||e.child||e.client||''),
        amount:dep,
        method:e.depositMethod||'No especificado',
        movementDate:e.depositDate||String(e.createdAt||'').slice(0,10)||new Date().toISOString().slice(0,10),
        createdAt:new Date().toISOString()
      });
      changes++;
    }

    const f=fc110EventFigures(e);
    if(fc110N(e.total)!==f.total){e.total=f.total;changes++}
    if(fc110N(e.paid)!==f.paid){e.paid=f.paid;changes++}
    if(fc110N(e.balance)!==f.balance){e.balance=f.balance;changes++}

    if(f.paid>f.total && f.total>0)warnings.push('Cobrado por encima del total: '+(e.eventName||e.child||e.client||e.id));
  }

  // Compras pagadas de proveedor: un solo egreso por compra.
  for(const p of (data.stockPurchases||[])){
    if(String(p.salonId)!==String(fc110Sid()))continue;
    const status=fc110Norm(p.paymentStatus);
    const paid=status.includes('pag')||fc110N(p.paidAmount)>0||fc110N(p.amountPaid)>0;
    if(!paid)continue;
    const key='v110:purchase:'+p.id;
    const exists=data.movements.some(m=>String(m.sourceKey||'')===key);
    if(exists)continue;
    const amount=fc110N(p.paidAmount||p.amountPaid||p.total||p.totalAmount);
    if(amount>0){
      data.movements.push({
        id:'exp110_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        salonId:fc110Sid(),
        sourceKey:key,
        type:'Gasto',
        category:'Compra a proveedor',
        concept:p.productName||p.detail||'Compra a proveedor',
        amount,
        method:p.paymentMethod||'No especificado',
        movementDate:String(p.paymentDate||p.paidAt||new Date().toISOString()).slice(0,10),
        createdAt:new Date().toISOString()
      });
      changes++;
    }
  }

  if(saveChanges && changes){
    try{save()}catch(_){}
  }
  return {changes,warnings};
}

async function fc110SaveMovement(movement){
  // Primero endpoint atómico existente.
  try{
    const out=await fc110Post('/api/finance-v94',{
      action:'add',salonId:fc110Sid(),movement
    });
    if((out.state?.movements||[]).some(x=>String(x.id)===String(movement.id))){
      return out.state;
    }
  }catch(err){
    console.warn('V110 endpoint financiero:',err);
  }

  // Fallback seguro sobre el estado más nuevo.
  const st=await fc110GetState();
  st.movements=Array.isArray(st.movements)?st.movements:[];
  if(!st.movements.some(x=>String(x.id)===String(movement.id)))st.movements.push(movement);
  await fc110PutState(st);
  const verify=await fc110GetState();
  if(!(verify.movements||[]).some(x=>String(x.id)===String(movement.id))){
    throw new Error('El servidor no confirmó el movimiento');
  }
  fc110UseState(verify);
  return verify;
}

function fc110OpenManualMovement(expense=false){
  const events=fc110SalonEvents().slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  if(!fc110Modal(`
    <div class="modal-title">
      <div><h2>${expense?'Registrar egreso':'Ingresar dinero'}</h2>
      <p>${expense?'Salida de dinero del salón':'Entrada de dinero al salón'}</p></div>
      <button type="button" class="ghost small" id="fc110-close">✕</button>
    </div>
    <form id="fc110-money-form">
      <div class="form-grid">
        <div class="field"><label>Concepto</label>
          <select name="category">
            ${expense
              ? '<option>Compra general</option><option>Servicio</option><option>Pago a proveedor</option><option>Gasto operativo</option><option>Personal</option><option>Otro egreso</option>'
              : '<option>Monto inicial</option><option>Cobro general</option><option>Aporte del salón</option><option>Otro ingreso</option>'}
          </select>
        </div>
        <div class="field"><label>Importe</label><input name="amount" type="number" min="1" step="0.01" required></div>
        <div class="field"><label>Medio de pago</label>
          <select name="method"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option><option>Tarjeta</option><option>Otro</option></select>
        </div>
        <div class="field"><label>Fecha</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div>
        <div class="field span2"><label>Asociar a una fiesta (opcional)</label>
          <select name="eventId"><option value="">Movimiento general del salón</option>
            ${events.map(e=>`<option value="${fc110Esc(e.id)}">${fc110Esc(e.date||'')} · ${fc110Esc(e.eventName||e.child||e.client||'Fiesta')}</option>`).join('')}
          </select>
        </div>
        <div class="field span2"><label>Detalle</label><input name="detail" maxlength="180"></div>
      </div>
      <div class="form-actions">
        <button type="button" class="ghost" id="fc110-cancel">Cancelar</button>
        <button type="submit" class="${expense?'danger':'primary'}">${expense?'Guardar egreso':'Guardar ingreso'}</button>
      </div>
    </form>`))return;

  fc110Q('#fc110-close').onclick=fc110Close;
  fc110Q('#fc110-cancel').onclick=fc110Close;
  const form=fc110Q('#fc110-money-form');
  form.onsubmit=async ev=>{
    ev.preventDefault();
    const fd=new FormData(form), amount=fc110N(fd.get('amount'));
    if(amount<=0)return fc110Toast('Ingresá un importe válido');
    const movement={
      id:'mov110_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
      salonId:fc110Sid(),
      eventId:String(fd.get('eventId')||''),
      sourceKey:'v110:manual:'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      type:expense?'Gasto':'Ingreso',
      category:String(fd.get('category')||''),
      concept:String(fd.get('detail')||'').trim()||String(fd.get('category')||''),
      amount,
      method:String(fd.get('method')||''),
      movementDate:String(fd.get('date')||''),
      manualMovement:true,
      createdAt:new Date().toISOString()
    };
    const btn=form.querySelector('[type=submit]');
    btn.disabled=true;btn.textContent='Guardando...';
    try{
      const st=await fc110SaveMovement(movement);
      fc110UseState(st);
      fc110AuditAccounting(false);
      fc110Close();
      fc110Toast(expense?'Egreso guardado correctamente':'Ingreso guardado correctamente');
      fc110RenderFinance();
    }catch(err){
      btn.disabled=false;btn.textContent=expense?'Guardar egreso':'Guardar ingreso';
      fc110Toast('No se pudo guardar: '+err.message);
    }
  };
}

async function fc110ResetFinance(){
  if(!confirm('¿Poner la contabilidad del salón en $0? Se mantienen salones, proveedores, reservas, personal, productos y stock.'))return;
  try{
    let done=false;
    try{
      const out=await fc110Post('/api/finance-v94',{action:'reset',salonId:fc110Sid()});
      if(out.state){fc110UseState(out.state);done=true}
    }catch(_){}
    if(!done){
      const st=await fc110GetState();
      st.movements=(st.movements||[]).filter(m=>String(m.salonId)!==String(fc110Sid()));
      st.providerPayments=(st.providerPayments||[]).filter(m=>String(m.salonId)!==String(fc110Sid()));
      st.servicePayments=(st.servicePayments||[]).filter(m=>String(m.salonId)!==String(fc110Sid()));
      for(const e of (st.events||[])){
        if(String(e.salonId)!==String(fc110Sid()))continue;
        e.deposit=0;e.paid=0;e.balance=fc110N(e.total);
        e.depositMethod='';e.depositDate='';
      }
      await fc110PutState(st);fc110UseState(await fc110GetState());
    }
    fc110Toast('Contabilidad reiniciada en $0');
    fc110RenderFinance();
  }catch(err){fc110Toast('No se pudo reiniciar: '+err.message)}
}

function fc110RenderFinance(){
  if(session?.role!=='salon'||view!=='finance')return;
  const c=fc110Q('#content');if(!c)return;

  const audit=fc110AuditAccounting(false);
  const movements=fc110SalonMovements().slice().sort((a,b)=>
    String(b.movementDate||b.createdAt||'').localeCompare(String(a.movementDate||a.createdAt||''))
  );
  const incomes=movements.filter(fc110IsIncome);
  const expenses=movements.filter(fc110IsExpense);
  const totalIn=incomes.reduce((s,m)=>s+fc110N(m.amount),0);
  const totalOut=expenses.reduce((s,m)=>s+fc110N(m.amount),0);
  const byMethod={Efectivo:0,Transferencia:0,'Mercado Pago':0,Tarjeta:0,Otro:0};
  incomes.forEach(m=>{
    const x=fc110Norm(m.method);
    const k=x.includes('efect')?'Efectivo':
      x.includes('transfer')?'Transferencia':
      x.includes('mercado')?'Mercado Pago':
      x.includes('tarjet')?'Tarjeta':'Otro';
    byMethod[k]+=fc110N(m.amount);
  });

  const events=fc110SalonEvents().map(e=>({e,f:fc110EventFigures(e)}));
  const booked=events.reduce((s,x)=>s+x.f.total,0);
  const paid=events.reduce((s,x)=>s+x.f.paid,0);
  const pending=events.reduce((s,x)=>s+x.f.balance,0);

  c.innerHTML=`
    <div id="fc110-finance">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div>
          <h2 style="margin:0">Finanzas</h2>
          <small class="muted">Control integral de caja, reservas y medios de pago.</small>
        </div>
        <b style="color:#7257ff">CONTROL V110</b>
      </div>

      <div class="toolbar" style="margin-bottom:14px">
        <button class="primary" id="fc110-income">+ Ingresar dinero</button>
        <button class="danger" id="fc110-expense">- Registrar egreso</button>
        <button class="secondary" id="fc110-reset">💰 Poner movimientos en $0</button>
      </div>

      <div class="grid stats">
        <div class="card stat"><small>Ingresos de caja</small><strong>${fc110Money(totalIn)}</strong><em>Movimientos registrados</em></div>
        <div class="card stat"><small>Egresos de caja</small><strong>${fc110Money(totalOut)}</strong><em>Compras y gastos</em></div>
        <div class="card stat"><small>Resultado de caja</small><strong>${fc110Money(totalIn-totalOut)}</strong><em>Ingresos - egresos</em></div>
        <div class="card stat"><small>Saldo por cobrar</small><strong>${fc110Money(pending)}</strong><em>Reservas activas</em></div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="section-title"><div><h3>💳 Caja por medio de pago</h3><small class="muted">Todo ingreso va a su casillero.</small></div></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
          ${Object.entries(byMethod).map(([k,v])=>`
            <div style="border:1px solid #e5e7eb;border-radius:12px;padding:13px">
              <small>${fc110Esc(k)}</small><strong style="display:block;font-size:20px">${fc110Money(v)}</strong>
            </div>`).join('')}
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="section-title"><div><h3>🎉 Control económico de reservas</h3><small class="muted">Total contratado, abonado y pendiente por fiesta.</small></div></div>
        ${events.length?`<div class="table-wrap"><table class="table"><thead><tr>
          <th>Fecha</th><th>Fiesta</th><th>Base</th><th>Adicionales</th><th>Stock</th><th>Cargos personal</th><th>Total</th><th>Pagado</th><th>Saldo</th>
        </tr></thead><tbody>
          ${events.map(({e,f})=>`<tr>
            <td>${fc110Esc(e.date||'')}</td>
            <td><b>${fc110Esc(e.eventName||e.child||e.client||'Fiesta')}</b></td>
            <td>${fc110Money(f.base)}</td><td>${fc110Money(f.extras)}</td><td>${fc110Money(f.stock)}</td>
            <td>${fc110Money(f.staffClient)}</td><td><b>${fc110Money(f.total)}</b></td>
            <td>${fc110Money(f.paid)}</td><td><b>${fc110Money(f.balance)}</b></td>
          </tr>`).join('')}
        </tbody><tfoot><tr><th colspan="6">TOTAL</th><th>${fc110Money(booked)}</th><th>${fc110Money(paid)}</th><th>${fc110Money(pending)}</th></tr></tfoot></table></div>`:
        '<div class="empty">No hay reservas activas.</div>'}
      </div>

      <div class="card" style="margin-top:16px">
        <div class="section-title"><div><h3>📒 Libro de movimientos</h3><small class="muted">Cada entrada y salida con su fiesta y medio de pago.</small></div></div>
        ${movements.length?`<div class="table-wrap"><table class="table"><thead><tr>
          <th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Fiesta</th><th>Detalle</th><th>Medio</th><th>Importe</th>
        </tr></thead><tbody>
          ${movements.map(m=>{
            const ev=(data.events||[]).find(e=>String(e.id)===String(m.eventId||''));
            return `<tr><td>${fc110Esc(m.movementDate||'')}</td><td>${fc110Esc(m.type||'')}</td>
              <td>${fc110Esc(m.category||'')}</td><td>${fc110Esc(ev?(ev.eventName||ev.child||ev.client||'Fiesta'):'General')}</td>
              <td>${fc110Esc(m.concept||'')}</td><td>${fc110Esc(m.method||'')}</td>
              <td><b>${fc110Money(m.amount)}</b></td></tr>`;
          }).join('')}
        </tbody></table></div>`:'<div class="empty">Todavía no hay movimientos.</div>'}
      </div>

      ${audit.warnings.length?`<div class="card" style="margin-top:16px;border-color:#f59e0b"><b>⚠️ Revisión contable</b><p>${audit.warnings.map(fc110Esc).join('<br>')}</p></div>`:''}
    </div>`;

  fc110Q('#fc110-income').onclick=()=>fc110OpenManualMovement(false);
  fc110Q('#fc110-expense').onclick=()=>fc110OpenManualMovement(true);
  fc110Q('#fc110-reset').onclick=fc110ResetFinance;
}

/* Ruta final: Finanzas ya no pasa por V33/V36/V38/V47/V52. */
const fc110PreviousSalonView=renderSalonView;
renderSalonView=function(){
  if(view==='finance')return fc110RenderFinance();
  return fc110PreviousSalonView();
};

/* Antes de abrir una fiesta/pago, sincroniza los números sin redibujar la pantalla. */
const fc110PrevOpenEvent=window.openEvent;
window.openEvent=function(eid){
  try{fc110AuditAccounting(false)}catch(_){}
  return typeof fc110PrevOpenEvent==='function'?fc110PrevOpenEvent(eid):undefined;
};
const fc110PrevPayment=window.openPayment;
window.openPayment=function(eid){
  try{fc110AuditAccounting(false)}catch(_){}
  return typeof fc110PrevPayment==='function'?fc110PrevPayment(eid):undefined;
};

/* ==========================
   PUBLICACIÓN DESTACADA
   ========================== */

function fc110Bool(v){return v===true||String(v).toLowerCase()==='true'||String(v)==='1'}
function fc110PromoFields(s){
  return {
    enabled:fc110Bool(s.featuredPromoEnabled)||fc110Bool(s.publicPromoEnabled),
    active:s.featuredPromoActive!==false && String(s.featuredPromoActive)!=='false' ||
           fc110Bool(s.publicPromoActive),
    title:String(s.featuredPromoTitle||s.publicPromoTitle||'').trim(),
    price:String(s.featuredPromoPrice||s.publicPromoPrice||'').trim(),
    text:String(s.featuredPromoText||s.publicPromoText||'').trim(),
    image:String(s.featuredPromoImage||s.publicPromoImage||''),
    until:String(s.featuredPromoValidUntil||s.publicPromoValidUntil||'')
  };
}
function fc110VisiblePromo(s){
  const p=fc110PromoFields(s);
  if(!p.enabled||!p.title)return false;
  if(p.until && new Date(p.until+'T23:59:59')<new Date())return false;
  // Si el salón ya cargó la publicación, se muestra. No se cobra una promo invisible.
  return true;
}
let fc110PromoPopupKey='';

async function fc110RenderPublicPromos(){
  if(session)return;
  let st;
  try{st=await fc110GetState()}catch(_){return}
  const promos=(st.salons||[]).filter(fc110VisiblePromo);
  fc110Q('#fc110-public-promos')?.remove();
  if(!promos.length)return;

  const sec=document.createElement('section');
  sec.id='fc110-public-promos';
  sec.className='fc110-public-promos';

let fc110AudioCtx=null;
function fc110PlayMusic(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return fc110Toast('Este navegador no permite audio aquí');
    fc110AudioCtx=fc110AudioCtx||new AC();
    const ctx=fc110AudioCtx, now=ctx.currentTime;
    const notes=[523.25,659.25,783.99,659.25,698.46,783.99,1046.5];
    notes.forEach((freq,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,now+i*.18);
      g.gain.exponentialRampToValueAtTime(.07,now+i*.18+.02);
      g.gain.exponentialRampToValueAtTime(.0001,now+i*.18+.16);
      o.connect(g);g.connect(ctx.destination);o.start(now+i*.18);o.stop(now+i*.18+.17);
    });
    fc110Q('#fc110-music').textContent='🎵 FiestaControl';
  }catch(_){}
}

<script>

(function(){
'use strict';

/* ============================================================
   FIESTACONTROL V112 PROFESIONAL

const Q111=(s,r=document)=>r.querySelector(s);
const QA111=(s,r=document)=>Array.from(r.querySelectorAll(s));
const N111=v=>Number(v||0);
const ESC111=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const NOR111=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

const SID111=()=>session?.salonId;
const ROLE111=()=>String(session?.role||'').toLowerCase();
const uid111=p=>(p||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);

function toast111(t){try{toast(t)}catch(_){alert(t)}}
function close111(){try{closeModal()}catch(_){const d=Q111('#modal');if(d)try{d.close()}catch(e){d.removeAttribute('open')}}}
function modal111(html){

}
async function state111(){
  const r=await fetch('/api/data',{cache:'no-store'});if(!r.ok)throw Error('No se pudo leer la base');
  const j=await r.json();return j?.data||j;
}
function use111(st){
  if(!st||typeof st!=='object')return;
  Object.keys(data).forEach(k=>delete data[k]);Object.assign(data,st);
}
async function put111(st){
  const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(st),cache:'no-store'});
  const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'No se pudo guardar');return j;
}

/* ============================================================
   1. COMUNIDAD ÚNICA
   ============================================================ */

function ensureCommunity111(){
  data.adminCommunityMessages=Array.isArray(data.adminCommunityMessages)?data.adminCommunityMessages:[];
  data.communityMessages=Array.isArray(data.communityMessages)?data.communityMessages:[];
  data.communityMessageReads=Array.isArray(data.communityMessageReads)?data.communityMessageReads:[];
}
function userKey111(){
  const s=session||{};
  return String(s.salonId||s.providerId||s.supplierId||s.marketSupplierId||s.userId||s.id||s.email||s.userEmail||'anon');
}
function roleGroup111(){
  const r=ROLE111();
  if(r==='salon')return 'salon';
  if(['provider','supplier'].includes(r))return 'provider';
  if(['admin','administrator','superadmin'].includes(r))return 'admin';
  return r;
}
function salonName111(idv){
  return (data.salons||[]).find(x=>String(x.id)===String(idv))?.name||'Salón';
}
function providerArrays111(){
  const all=[...(data.marketSuppliers||[]),...(data.providers||[]),...(data.suppliers||[])];
  const seen=new Set();return all.filter(x=>{const k=String(x.id||x.email||x.name);if(seen.has(k))return false;seen.add(k);return true});
}
function providerName111(idv){
  return providerArrays111().find(x=>String(x.id)===String(idv))?.name||
         providerArrays111().find(x=>String(x.id)===String(idv))?.businessName||
         'Proveedor';
}
function allowedAdmin111(m){
  const g=roleGroup111(),aud=NOR111(m.audience||m.target||'all');
  if(g!=='salon'&&g!=='provider')return false;
  if(!aud||['all','todos','ambos'].includes(aud))return true;
  if(g==='salon'&&['salon','salons','salones'].includes(aud))return true;
  if(g==='provider'&&['provider','providers','supplier','proveedores'].includes(aud))return true;
  return false;
}
function allowedCommunity111(m){
  const g=roleGroup111(),u=userKey111();
  if(g!=='salon'&&g!=='provider')return false;
  if(String(m.fromUserKey||'')===u)return true;
  const target=String(m.toUserKey||'');
  if(target&&target===u)return true;
  const scope=NOR111(m.scope||m.audience||'all');
  if(!target && ['all','todos','comunidad'].includes(scope))return true;
  if(!target && g==='salon'&&['salons','salones'].includes(scope))return true;
  if(!target && g==='provider'&&['providers','proveedores'].includes(scope))return true;
  return false;
}
function read111(mid){
  ensureCommunity111();const u=userKey111();
  return data.communityMessageReads.some(r=>String(r.messageId)===String(mid)&&String(r.userKey)===u);
}
function markRead111(mid){
  ensureCommunity111();if(read111(mid))return;
  data.communityMessageReads.push({id:uid111('read'),messageId:mid,userKey:userKey111(),readAt:new Date().toISOString()});
}
function unread111(){
  ensureCommunity111();
  const a=data.adminCommunityMessages.filter(m=>m&&m.active!==false&&allowedAdmin111(m)&&!read111(m.id)).length;
  const c=data.communityMessages.filter(m=>m&&m.active!==false&&allowedCommunity111(m)&&String(m.fromUserKey||'')!==userKey111()&&!read111(m.id)).length;
  return a+c;
}
function fmtDT111(v){try{return new Date(v).toLocaleString('es-AR')}catch(_){return String(v||'')}}
function sender111(m){
  if(m.fromName)return m.fromName;
  if(m.fromSalonId)return salonName111(m.fromSalonId);
  if(m.fromProviderId)return providerName111(m.fromProviderId);
  return m.from||'Comunidad';
}

  Q111('#admin-msg111').onsubmit=async e=>{

      });

    }catch(err){toast111('No se pudo enviar: '+err.message)}

window.openCommunityMessage111=function(){
  const salons=(data.salons||[]).filter(s=>s.status!=='Suspendido'&&String(s.id)!==String(SID111()));

function buffer111(){
  const s=(data.salons||[]).find(x=>String(x.id)===String(SID111()));
  return Math.max(30,N111(s?.cleanupBufferMinutes||60));
}
function mins111(t){
  const [h,m]=String(t||'').split(':').map(Number);return Number.isFinite(h)&&Number.isFinite(m)?h*60+m:null;
}
function conflict111(date,start,end,excludeId=''){
  const ns=mins111(start),ne=mins111(end),buf=buffer111();if(ns===null||ne===null)return null;
  return salonEvents111().find(e=>{
    if(String(e.id)===String(excludeId)||String(e.date)!==String(date))return false;
    const os=mins111(e.start),oe=mins111(e.end);if(os===null||oe===null)return false;
    return ns < oe+buf && os < ne+buf;
  })||null;
}

function payments111(eid){

function figures111(e){
  const base=N111(e.basePrice??e.baseTotal);
  const general=N111(e.extrasTotal);
  const stock=N111(e.stockItemsTotal);
  const typeExtras=N111(e.typeExtrasTotal) || (
    N111(e.extraAdultTotal)+N111(e.extraChildTotal)+N111(e.extraWaiterTotal)+N111(e.extraKitchenTotal)+N111(e.extraAnimatorTotal)+N111(e.extraHourTotal)
  );
  const computed=base+general+stock+typeExtras;
  const total=N111(e.total)>0?N111(e.total):computed;
  const p=payments111(e.id);let paid=p.reduce((s,x)=>s+N111(x.amount),0);
  if(paid<=0)paid=N111(e.paid||e.deposit);
  return {base,general,stock,typeExtras,total,paid,balance:Math.max(0,total-paid)};
}

  Q111('#income111').onclick=()=>window.FiestaControlV110?.income?.();

<script>


/* ============================================================
   V112 - LIMPIEZA DE PEDIDOS / COMPRAS DE PRUEBA EN PROVEEDORES
   ============================================================ */
(function(){
'use strict';
function sid112(){ return String(session?.salonId||session?.id||session?.userId||''); }
function n112(v){ v=Number(v); return Number.isFinite(v)?v:0; }
function items112(o){
  if(Array.isArray(o?.items)&&o.items.length) return o.items.map(x=>({productId:x.productId||x.id||'',productName:x.productName||x.name||'',qty:n112(x.qty||x.quantity||0)}));
  return [{productId:o?.productId||'',productName:o?.productName||'',qty:n112(o?.qty||0)}];
}
function norm112(s){return String(s||'').trim().toLowerCase();}
function rollbackStock112(order,sid){
  if(order?.targetType!=='stock'||order?.stockAdded!==true)return;
  (items112(order)||[]).forEach(it=>{
    const p=(data.stockProducts||[]).find(x=>String(x.salonId)===sid&&((it.productId&&String(x.id)===String(it.productId))||norm112(x.name)===norm112(it.productName)));
    if(p)p.stock=Math.max(0,n112(p.stock)-n112(it.qty));
  });
}
window.clearSupplierTests112=function(){
  const sid=sid112();
  const purchases=(data.stockPurchases||[]).filter(o=>String(o.salonId)===sid);
  const legacy=(data.orders||[]).filter(o=>String(o.salonId)===sid);
  const ids=new Set([...purchases,...legacy].map(o=>String(o.id)));
  if(!ids.size){ if(typeof toast==='function')toast('No hay pedidos ni compras para borrar'); return; }
  showModal(`
    <div class="modal-title"><div><h2>🧹 Borrar pedidos y compras</h2><p>Limpieza de operaciones de prueba del salón.</p></div><button class="ghost small" onclick="closeModal()">✕</button></div>
    <div class="card" style="margin:0 0 14px"><b>Se eliminarán ${purchases.length+legacy.length} pedido(s) / compra(s)</b><p class="muted" style="margin:7px 0 0">También se borrarán sus chats, pagos y movimientos contables. Si una compra entregada agregó mercadería al stock, se descontará únicamente esa cantidad. No se borran proveedores ni productos.</p></div>
    <div class="form-actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="danger" id="confirmClearSup112">Sí, borrar pedidos y compras</button></div>`);
  const b=document.querySelector('#confirmClearSup112');
  if(!b)return;
  b.onclick=async()=>{
    purchases.forEach(o=>rollbackStock112(o,sid));
    data.stockPurchases=(data.stockPurchases||[]).filter(o=>String(o.salonId)!==sid);
    data.orders=(data.orders||[]).filter(o=>String(o.salonId)!==sid);
    data.orderMessages=(data.orderMessages||[]).filter(m=>!ids.has(String(m.orderId)));
    data.providerPayments=(data.providerPayments||[]).filter(p=>!ids.has(String(p.orderId)));
    data.movements=(data.movements||[]).filter(m=>{
      if(String(m.salonId)!==sid)return true;
      if(ids.has(String(m.orderId||''))||ids.has(String(m.stockPurchaseId||'')))return false;
      const sk=String(m.sourceKey||'');
      for(const oid of ids){if(sk===`stock-purchase:${oid}`||sk===`provider-order:${oid}`)return false;}
      return true;
    });
    try{ await save(); }catch(e){}
    closeModal();
    if(typeof window.renderSuppliersV57==='function')window.renderSuppliersV57();
    if(typeof toast==='function')toast('Pedidos y compras eliminados');
  };
};

const old112=window.renderSuppliersV57;
if(typeof old112==='function'){
  window.renderSuppliersV57=function(){
    const r=old112.apply(this,arguments);
    setTimeout(()=>{
      if(session?.role!=='salon'||view!=='suppliers')return;
      const content=document.querySelector('#content'); if(!content||document.querySelector('#clearSupplierTests112'))return;
      const first=content.querySelector('.card'); if(!first)return;
      const actions=first.querySelector('.section-title > div:last-child'); if(!actions)return;
      const btn=document.createElement('button'); btn.id='clearSupplierTests112'; btn.className='danger'; btn.textContent='🧹 Borrar pedidos y compras'; btn.onclick=window.clearSupplierTests112; actions.appendChild(btn);
    },30);
    return r;
  };
  ['56','55','54','53'].forEach(v=>window['renderSuppliersV'+v]=window.renderSuppliersV57);
}
})();

</script>
